# ESP32 + PN532 on the LG DLEX4370K dryer's Tag On logo.
# First flash: the factory .bin through web.esphome.io in Chrome or Edge, which then asks for
# the Wi-Fi network (Improv). Later updates: esphome run dryer.yaml, over Wi-Fi.
esphome:
  name: lg-dryer
  friendly_name: LG Dryer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# No network baked in: Improv (over USB) or the fallback hotspot sets it, and it is kept in flash.
wifi:
  ap:
    ssid: LG Dryer Setup

captive_portal:

improv_serial:

external_components:
  - source:
      type: local
      path: components

# PN532 switches: I2C mode. Power it from the ESP32's 3V3 pin.
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz
  # The PN532 holds SCL low (clock stretching) while it works. The default wait is too short:
  # the ESP32 gives up mid-transfer and the PN532 is left stuck. 13 ms is the most ESP-IDF allows.
  timeout: 13ms

lg_tagon:
  # Each poll makes the dryer beep. Raise this if 30 s is too often.
  update_interval: 30s
  status:
    name: Status
  running:
    name: Running
  remaining_time:
    name: Time remaining
  initial_time:
    name: Cycle length
  course:
    name: Cycle
  dry_level:
    name: Dry level
  temperature_setting:
    name: Temperature setting
  child_lock:
    name: Child lock
  error_code:
    name: Error code
  status_code:
    name: Status code
  model:
    name: Model code
  reachable:
    name: Tag reachable
  raw_monitoring:
    name: Raw monitoring
